<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SaaS — WhatsApp Login</title>
<style>
  :root{
    --bg:#0f172a; --card:#111827; --accent:#25D366; --accent-dark:#128C7E;
    --text:#e5e7eb; --muted:#9ca3af;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(160deg,var(--bg),#1e293b);
    font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    color:var(--text); padding:20px;
  }
  .card{
    background:var(--card); border:1px solid #1f2937; border-radius:16px;
    padding:40px 32px; width:100%; max-width:380px; text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.4);
  }
  .logo{
    width:56px;height:56px;border-radius:14px;margin:0 auto 20px;
    background:var(--accent); display:flex;align-items:center;justify-content:center;
    font-size:28px;
  }
  h1{font-size:22px;margin-bottom:6px;}
  p.sub{color:var(--muted);font-size:14px;margin-bottom:28px;}
  .wa-btn{
    display:flex; align-items:center; justify-content:center; gap:10px;
    width:100%; padding:14px 18px; border:none; border-radius:10px;
    background:var(--accent); color:#fff; font-size:16px; font-weight:600;
    cursor:pointer; transition:background .15s ease, transform .1s ease;
    text-decoration:none;
  }
  .wa-btn:hover{background:var(--accent-dark);}
  .wa-btn:active{transform:scale(.98);}
  .wa-btn svg{width:22px;height:22px;flex-shrink:0;}
  .status{margin-top:16px;font-size:13px;color:var(--muted);min-height:18px;}
  .footer{margin-top:24px;font-size:12px;color:#4b5563;}
</style>
</head>
<body>

<div class="card">
  <div class="logo">🔐</div>
  <h1>Sign in to Continue</h1>
  <p class="sub">Verify yourself instantly through WhatsApp</p>

  <a href="#" id="waLogin" class="wa-btn">
    <svg viewBox="0 0 32 32" fill="#fff"><path d="M16.001 3C9.373 3 4 8.373 4 15c0 2.634.85 5.073 2.292 7.05L4.75 28.25l6.4-1.68A11.94 11.94 0 0 0 16 27c6.628 0 12-5.373 12-12S22.629 3 16.001 3zm6.98 16.98c-.294.826-1.462 1.51-2.4 1.7-.638.13-1.47.234-4.27-.916-3.58-1.474-5.888-5.09-6.07-5.328-.176-.238-1.446-1.926-1.446-3.674 0-1.748.918-2.606 1.244-2.964.294-.322.65-.404.868-.404.218 0 .434.002.624.012.2.01.468-.076.732.558.294.706.998 2.454 1.086 2.634.088.18.146.392.03.63-.116.238-.176.386-.352.594-.176.208-.37.464-.528.622-.176.176-.36.368-.156.72.206.352.914 1.508 1.964 2.442 1.35 1.204 2.488 1.576 2.84 1.752.352.176.558.148.764-.09.206-.238.882-1.028 1.118-1.38.234-.352.472-.294.794-.176.324.118 2.056.97 2.408 1.146.352.176.586.264.674.412.088.148.088.856-.206 1.682z"/></svg>
    <span>Continue with WhatsApp</span>
  </a>

  <div class="status" id="status"></div>
  <div class="footer">By continuing you agree to our Terms</div>
</div>

<script>
  // Set the number you want the "hi" message sent to (country code, no + or spaces)
  const PHONE_NUMBER = "919999999999"; // <-- change this
  const MESSAGE = "hi";

  document.getElementById('waLogin').addEventListener('click', function(e){
    e.preventDefault();
    const status = document.getElementById('status');
    status.textContent = "Opening WhatsApp...";

    const url = `https://wa.me/${PHONE_NUMBER}?text=${encodeURIComponent(MESSAGE)}`;
    window.open(url, '_blank');

    status.textContent = "Message sent request opened. Waiting for confirmation...";
  });
</script>

</body>
</html>
